spring.application.name=process-map-automation
server.port=${SERVER_PORT:3000}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/process_map_dev}
spring.datasource.username=${DB_USER:process_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.target=23
spring.datasource.hikari.maximum-pool-size=8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.baseline.admin-token=${BASELINE_ADMIN_TOKEN:}
app.operator.username=${APP_OPERATOR_USERNAME:}
app.operator.password-hash=${APP_OPERATOR_PASSWORD_HASH:}
app.user-working-copies.enabled=${USER_WORKING_COPIES_ENABLED:false}
app.profile-preflight.enabled=${PROFILE_PREFLIGHT_ENABLED:false}
app.flow-change.synthetic-enabled=${FLOW_CHANGE_SYNTHETIC_ENABLED:false}
